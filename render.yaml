services:
  - type: web
    name: wyckoff-trading-assistant
    env: python
    region: oregon
    plan: free
    rootDir: Wyckoff_chatbot
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: FLASK_ENV
        value: production
